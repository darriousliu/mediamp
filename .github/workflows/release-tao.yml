name: Complete MediaMP all-platform release

on:
  push:
    branches: [codex/mediamp-0.4.0-tao]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-tao-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-native:
    name: Build missing mpv JNI (${{ matrix.platform }})
    if: github.repository == 'darriousliu/mediamp'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-arm64
            runner: windows-11-arm
            java: microsoft
            java-version: '21'
            architecture: aarch64
          - platform: macos-x64
            runner: macos-15-intel
            java: temurin
            java-version: '25'
            architecture: x64
          - platform: linux-x64
            runner: ubuntu-24.04
            java: temurin
            java-version: '25'
            architecture: x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java }}
          java-version: ${{ matrix.java-version }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.platform == 'windows-arm64' && 'arm64' || 'x64' }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: CLANGARM64
          install: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-lld mingw-w64-clang-aarch64-llvm mingw-w64-clang-aarch64-crt mingw-w64-clang-aarch64-headers mingw-w64-clang-aarch64-winpthreads
      - name: Install Linux JNI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ binutils libgl1-mesa-dev libx11-dev zlib1g-dev libegl1 libx11-xcb1 libasound2t64 libdrm2 libfontconfig1 libpulse0 libvulkan1
      - name: Rebuild and verify Windows arm64 JNI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $runtimeJar = Join-Path $env:RUNNER_TEMP 'mediamp-mpv-base.jar'
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/openani/mediamp/mediamp-mpv-runtime-windows-arm64/0.4.0/mediamp-mpv-runtime-windows-arm64-0.4.0.jar' -OutFile $runtimeJar
          python scripts/prepare-tao-windows-runtime.py --msys2-dir $env:MSYS2_ROOT --base-runtime-jar $runtimeJar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild and verify macOS x64 or Linux x64 JNI
        if: runner.os != 'Windows'
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          artifact="mediamp-mpv-runtime-$NATIVE_PLATFORM"
          curl --fail --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/openani/mediamp/$artifact/0.4.0/$artifact-0.4.0.jar" \
            --output "$RUNNER_TEMP/mediamp-mpv-base.jar"
          python "scripts/prepare-tao-${NATIVE_PLATFORM%-*}-runtime.py" \
            --base-runtime-jar "$RUNNER_TEMP/mediamp-mpv-base.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: mpv-runtime-${{ matrix.platform }}
          path: mediamp-mpv/build/prebuilt-runtime-jars/${{ matrix.platform }}/*.jar
          if-no-files-found: error

  publish:
    name: Build all targets and publish missing coordinates
    if: github.repository == 'darriousliu/mediamp'
    needs: desktop-native
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Install native and Android build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          python -m pip install meson ninja
          brew install nasm pkgconf
      - uses: gradle/actions/setup-gradle@v4
      - name: Read the release version
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          version = next(line.partition('=')[2].strip() for line in Path('gradle.properties').read_text().splitlines() if line.startswith('version.name='))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TAO_VERSION={version}\n')
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          pattern: mpv-runtime-*
          path: downloaded-mpv-runtimes
      - name: Collect new runtimes and retain the two published runtimes
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import shutil
          for source in Path('downloaded-mpv-runtimes').glob('mpv-runtime-*/*.jar'):
              platform = source.parent.name.removeprefix('mpv-runtime-')
              target = Path('mediamp-mpv/build/prebuilt-runtime-jars') / platform / source.name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PYCODE
          for platform in macos-arm64 windows-x64; do
            artifact="mediamp-mpv-runtime-$platform"
            destination="mediamp-mpv/build/prebuilt-runtime-jars/$platform"
            mkdir -p "$destination"
            curl --fail --location --retry 3 \
              "https://repo.maven.apache.org/maven2/io/github/darriousliu/mediamp/$artifact/$TAO_VERSION/$artifact-$TAO_VERSION.jar" \
              --output "$destination/mediamp-mpv-runtime-$TAO_VERSION-$platform.jar"
          done
          python scripts/prepare-upstream-ffmpeg-runtimes.py
      - name: Test TAO backend and publication validation
        run: |
          ./gradlew :mediamp-mpv:desktopTest \
            --tests '*MpvDesktopRenderBackendTest' \
            --tests '*MpvTextureGenerationTrackerTest' \
            --tests '*MpvUriLoadTargetTest' \
            :mediamp-mpv-tao:test --console=plain \
            -Pmediamp.mpv.buildvariant= -Pmediamp.ffmpeg.buildvariant= \
            -Pmediamp.sign.publications.disabled=true
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and stage the complete 65-coordinate release
        run: |
          ./gradlew stageTaoFullRelease :mediamp-exoplayer:verifyWsolaLicensePackaging --console=plain \
            "-Dmaven.repo.local=$RUNNER_TEMP/tao-maven-staging" \
            -Pmediamp.mpv.buildvariant=android -Pmediamp.ffmpeg.buildvariant=ios,android \
            -Pmediamp.mpv.androidabis=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -Pmediamp.ffmpeg.androidabis=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -Pmediamp.exoplayer.wsola.androidabis=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -Pmediamp.sign.publications.disabled=true
      - name: Validate all platforms and select only unpublished coordinates
        run: |
          python scripts/publish-tao-release.py \
            --staging "$RUNNER_TEMP/tao-maven-staging" \
            --output "$RUNNER_TEMP/tao-release" --version "$TAO_VERSION" \
            --supplement-existing --prepare-only
      - name: Publish missing coordinates to Central, with Packages fallback on rejection
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v gpg >/dev/null || brew install gnupg
          python scripts/publish-tao-release.py \
            --output "$RUNNER_TEMP/tao-release" --version "$TAO_VERSION" \
            --supplement-existing --repository "$GITHUB_REPOSITORY"
      - name: Retain exact publication files and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediamp-all-platforms-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tao-release
            mediamp-*/build/reports
          if-no-files-found: warn
          retention-days: 14
